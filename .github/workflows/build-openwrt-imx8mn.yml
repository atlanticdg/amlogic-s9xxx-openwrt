#============================================================================================
# Build OpenWrt for i.MX8MN Mozart 2
# Repository: atlanticdg/amlogic-s9xxx-openwrt
# Source: OpenWrt / ImmortalWrt
#============================================================================================

name: Build OpenWrt for i.MX8MN Mozart 2

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "OpenWrt 源码仓库"
        required: true
        default: "https://github.com/openwrt/openwrt.git"
        type: choice
        options:
          - "https://github.com/openwrt/openwrt.git"
          - "https://github.com/immortalwrt/immortalwrt.git"
      source_branch:
        description: "源码分支"
        required: true
        default: "openwrt-24.10"
        type: choice
        options:
          - "openwrt-24.10"
          - "openwrt-23.05"
          - "main"
          - "master"
      root_password:
        description: "root 密码"
        required: false
        default: "password"
        type: string
      use_ccache:
        description: "使用 ccache 加速"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Etc/UTC
  CCACHE_DIR: /builder/openwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # ============================================
      # 1. 检出当前仓库（获取 DTS 等自定义文件）
      # ============================================
      - name: Checkout custom repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: custom-repo

      # ============================================
      # 2. 初始化编译环境
      # ============================================
      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u

      # ============================================
      # 3. 创建虚拟磁盘（解决空间不足）
      # ============================================
      - name: Create virtual disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th

      # ============================================
      # 4. 克隆 OpenWrt 源码
      # ============================================
      - name: Clone OpenWrt source
        working-directory: /builder
        run: |
          REPO="${{ inputs.source_repo }}"
          BRANCH="${{ inputs.source_branch }}"
          echo "Cloning ${REPO} (${BRANCH})..."
          git clone -q --single-branch --depth=1 --branch="${BRANCH}" "${REPO}" openwrt
          ln -sf /builder/openwrt ${{ github.workspace }}/openwrt
          echo "build_tag=mozart2_${BRANCH}_$(date +%Y%m%d)" >> ${GITHUB_ENV}
          echo "Source: ${REPO} @ ${BRANCH}"

      # ============================================
      # 5. 注入 Mozart 2 设备支持（关键步骤）
      # ============================================
      - name: Inject Mozart 2 device support
        run: |
          cd openwrt/
          CUSTOM_DIR="${{ github.workspace }}/custom-repo"

          # --- 5.1 查找并复制 DTS 文件 ---
          DTS_FILE=""
          for d in "${CUSTOM_DIR}/dts" "${CUSTOM_DIR}"; do
            if [[ -f "${d}/imx8mn-mozart2.dts" ]]; then
              DTS_FILE="${d}/imx8mn-mozart2.dts"
              break
            fi
          done

          if [[ -z "${DTS_FILE}" ]]; then
            echo "ERROR: imx8mn-mozart2.dts not found in repository!"
            echo "Please place it at: repo-root/imx8mn-mozart2.dts or repo-root/dts/imx8mn-mozart2.dts"
            exit 1
          fi
          echo "Found DTS: ${DTS_FILE}"

          # --- 5.2 复制到 OpenWrt 内核文件注入目录 ---
          DTS_TARGET="target/linux/imx/files/arch/arm64/boot/dts/freescale"
          mkdir -p "${DTS_TARGET}"
          cp -v "${DTS_FILE}" "${DTS_TARGET}/imx8mn-mozart2.dts"

          # --- 5.3 在 cortexa53.mk 中注册设备 ---
          MK_FILE="target/linux/imx/image/cortexa53.mk"
          if ! grep -q "imx8mn-mozart2" "${MK_FILE}"; then
            echo "" >> "${MK_FILE}"
            cat >> "${MK_FILE}" << 'EOF'

define Device/imx8mn-mozart2
  DEVICE_VENDOR := B&O
  DEVICE_MODEL := Mozart 2 (i.MX8MN)
  DEVICE_DTS := imx8mn-mozart2
  DEVICE_PACKAGES := kmod-swconfig kmod-switch-rtl8366s kmod-switch-rtl8306 \
    kmod-fs-ext4 kmod-fs-vfat kmod-fs-ntfs3 \
    kmod-usb-core kmod-usb2 kmod-usb3 \
    wpad-mesh-openssl
endef
TARGET_DEVICES += imx8mn-mozart2
EOF
            echo "Registered imx8mn-mozart2 device in ${MK_FILE}"
          else
            echo "Device imx8mn-mozart2 already registered"
          fi

          # --- 5.4 验证注入 ---
          echo "=== Injected files ==="
          ls -la "${DTS_TARGET}/imx8mn-mozart2.dts"
          echo "=== Device definitions (tail) ==="
          tail -20 "${MK_FILE}"

      # ============================================
      # 6. 更新 Feeds
      # ============================================
      - name: Update feeds
        run: cd openwrt/ && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt/ && ./scripts/feeds install -a

      # ============================================
      # 7. 生成编译配置（.config）
      # ============================================
      - name: Generate config
        run: |
          cd openwrt/
          cat > .config << EOF
          # Target
          CONFIG_TARGET_imx=y
          CONFIG_TARGET_imx_cortexa53=y
          CONFIG_TARGET_DEVICE_imx_cortexa53_DEVICE_imx8mn-mozart2=y

          # Partition size
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_TARGET_KERNEL_PARTSIZE=32

          # ccache
          CONFIG_CCACHE=${{ inputs.use_ccache && 'y' || 'n' }}

          # LuCI & apps
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          # Network & wireless
          CONFIG_PACKAGE_wpad-mesh-openssl=y
          CONFIG_PACKAGE_wpa-cli=y

          # Utilities
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_block-mount=y

          # Filesystem
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y

          # Switch
          CONFIG_PACKAGE_kmod-switch-rtl8366s=y
          CONFIG_PACKAGE_kmod-switch-rtl8306=y
          CONFIG_PACKAGE_kmod-swconfig=y

          # USB
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          EOF

          make defconfig
          echo "=== Target device check ==="
          grep "CONFIG_TARGET_DEVICE" .config || true

      # ============================================
      # 8. 自定义 root 密码和主机名
      # ============================================
      - name: Customize root password and hostname
        run: |
          cd openwrt/
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom << 'EOF'
          #!/bin/sh
          # 设置 root 密码（使用 passwd 命令，兼容 busybox）
          echo -e "__ROOT_PW__\n__ROOT_PW__" | passwd root >/dev/null 2>&1
          # 设置主机名
          uci set system.@system[0].hostname='mozart2'
          uci commit system
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom
          sed -i "s/__ROOT_PW__/${{ inputs.root_password }}/g" files/etc/uci-defaults/99-custom

      # ============================================
      # 9. 下载源码包
      # ============================================
      - name: Download package sources
        run: |
          cd openwrt/
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ============================================
      # 10. 准备内核源码并注入 DTB 编译目标（关键修复）
      # ============================================
      - name: Prepare kernel and inject DTB target
        run: |
          cd openwrt/
          echo "=== Preparing kernel source ==="
          make target/linux/prepare V=s

          # 找到内核源码目录
          KERNEL_DIR=$(find build_dir -maxdepth 3 -type d -name "linux-*.*" | head -1)
          if [[ -z "${KERNEL_DIR}" ]]; then
            echo "ERROR: Could not find kernel source directory!"
            find build_dir -maxdepth 4 -type d -name "linux-*" 2>/dev/null | head -10
            exit 1
          fi
          echo "Kernel dir: ${KERNEL_DIR}"

          # 修改内核 DTS Makefile，注册 mozart2 DTB 编译目标
          DTS_MAKEFILE="${KERNEL_DIR}/arch/arm64/boot/dts/freescale/Makefile"
          if [[ -f "${DTS_MAKEFILE}" ]]; then
            if grep -q "imx8mn-mozart2.dtb" "${DTS_MAKEFILE}"; then
              echo "imx8mn-mozart2.dtb already in kernel Makefile"
            else
              # 在 imx8mn-ddr4-evk.dtb 行后添加
              sed -i '/imx8mn-ddr4-evk\.dtb/a dtb-$(CONFIG_ARCH_MXC) += imx8mn-mozart2.dtb' "${DTS_MAKEFILE}"
              echo "Added imx8mn-mozart2.dtb to kernel DTS Makefile"
            fi
            grep -n "imx8mn-mozart2" "${DTS_MAKEFILE}" || true
          else
            echo "WARNING: Kernel DTS Makefile not found at ${DTS_MAKEFILE}"
            find "${KERNEL_DIR}" -name "Makefile" -path "*/dts/*" 2>/dev/null | head -5
          fi

          # 确保 DTS 文件已复制到内核源码目录
          KERNEL_DTS="${KERNEL_DIR}/arch/arm64/boot/dts/freescale/imx8mn-mozart2.dts"
          if [[ ! -f "${KERNEL_DTS}" ]]; then
            echo "WARNING: DTS not copied to kernel dir, copying manually..."
            cp -v target/linux/imx/files/arch/arm64/boot/dts/freescale/imx8mn-mozart2.dts "${KERNEL_DTS}"
          fi
          ls -la "${KERNEL_DTS}"

      # ============================================
      # 11. 编译
      # ============================================
      - name: Compile OpenWrt
        id: compile
        run: |
          cd openwrt/
          echo "Compiling with $(nproc) threads..."
          make -j$(($(nproc) + 1)) V=s 2>&1 | tail -100
          RET=${PIPESTATUS[0]}
          if [[ ${RET} -ne 0 ]]; then
            echo "First build failed, retrying with -j1 for error details..."
            make -j1 V=s 2>&1 | tail -300
            RET=${PIPESTATUS[0]}
          fi
          if [[ ${RET} -ne 0 ]]; then
            echo "status=failed" >> ${GITHUB_OUTPUT}
            exit 1
          fi
          echo "status=success" >> ${GITHUB_OUTPUT}
          ccache -s 2>/dev/null || true

      # ============================================
      # 12. 验证镜像并确保 DTB 正确
      # ============================================
      - name: Verify and fix image DTB
        if: ${{ steps.compile.outputs.status == 'success' }}
        run: |
          cd openwrt/
          OUT_DIR="bin/targets/imx/cortexa53"

          echo "=== Build output files ==="
          ls -lah "${OUT_DIR}/"

          # 找到镜像
          IMG_GZ=$(ls ${OUT_DIR}/*.img.gz 2>/dev/null | head -1)
          if [[ -z "${IMG_GZ}" ]]; then
            echo "WARNING: No .img.gz found, listing all outputs..."
            ls -la ${OUT_DIR}/
            exit 0
          fi
          echo "Image: ${IMG_GZ}"

          # 解压
          gunzip -k -f "${IMG_GZ}" 2>/dev/null || true
          IMG="${IMG_GZ%.gz}"
          [[ -f "${IMG}" ]] || { echo "Decompression failed"; exit 1; }

          # 获取 boot 分区偏移
          BOOT_INFO=$(parted "${IMG}" unit B print 2>/dev/null || true)
          BOOT_START=$(echo "${BOOT_INFO}" | grep "^ 1 " | awk '{print $2}' | tr -d 'B')

          if [[ -z "${BOOT_START}" ]]; then
            echo "WARNING: Could not detect boot partition, skipping DTB check"
            gzip -k -f "${IMG}"
            exit 0
          fi

          echo "Boot partition offset: ${BOOT_START}"
          mkdir -p /tmp/bootmnt
          sudo mount -o loop,offset=${BOOT_START} "${IMG}" /tmp/bootmnt 2>/dev/null || {
            echo "WARNING: Could not mount boot partition"
            gzip -k -f "${IMG}"
            exit 0
          }

          echo "=== Boot partition contents ==="
          ls -la /tmp/bootmnt/

          # 检查 Mozart 2 DTB 是否存在
          if [[ -f "/tmp/bootmnt/imx8mn-mozart2.dtb" ]]; then
            echo "✅ imx8mn-mozart2.dtb found in boot partition"
            strings /tmp/bootmnt/imx8mn-mozart2.dtb | grep -i "model" | head -3 || true
          else
            echo "⚠️  imx8mn-mozart2.dtb NOT found, checking for other dtbs..."
            find /tmp/bootmnt -name "*.dtb" -exec ls -la {} \;

            # 尝试从 build_dir 找到编译好的 dtb 并复制进去
            MOZART2_DTB=$(find build_dir -name "imx8mn-mozart2.dtb" 2>/dev/null | head -1)
            if [[ -n "${MOZART2_DTB}" && -f "${MOZART2_DTB}" ]]; then
              echo "Copying ${MOZART2_DTB} to boot partition..."
              sudo cp "${MOZART2_DTB}" /tmp/bootmnt/imx8mn-mozart2.dtb
              echo "✅ DTB copied to boot partition"
            else
              echo "WARNING: Compiled imx8mn-mozart2.dtb not found in build_dir"
            fi
          fi

          # 检查启动脚本是否引用正确的 dtb
          if [[ -f "/tmp/bootmnt/boot.scr" ]]; then
            echo "=== boot.scr detected (binary, cannot auto-check) ==="
            echo "Please ensure U-Boot loads imx8mn-mozart2.dtb"
          fi
          if [[ -f "/tmp/bootmnt/uEnv.txt" ]]; then
            echo "=== uEnv.txt contents ==="
            cat /tmp/bootmnt/uEnv.txt
          fi
          if [[ -f "/tmp/bootmnt/extlinux/extlinux.conf" ]]; then
            echo "=== extlinux.conf contents ==="
            cat /tmp/bootmnt/extlinux/extlinux.conf
          fi

          sync
          sudo umount /tmp/bootmnt

          # 重新压缩
          gzip -k -f "${IMG}"
          echo "=== Image verification complete ==="

      # ============================================
      # 13. 整理输出
      # ============================================
      - name: Organize output
        if: ${{ steps.compile.outputs.status == 'success' }}
        run: |
          cd openwrt/
          mkdir -p output
          cp -f bin/targets/imx/cortexa53/*.img.gz output/ 2>/dev/null || true
          cp -f bin/targets/imx/cortexa53/*.manifest output/ 2>/dev/null || true
          cp -f .config output/config
          echo "=== Final output ==="
          ls -lah output/

      # ============================================
      # 14. 发布到 Release
      # ============================================
      - name: Upload to Release
        if: ${{ steps.compile.outputs.status == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.build_tag }}
          name: OpenWrt for Mozart 2 (i.MX8MN) - ${{ env.build_tag }}
          files: |
            openwrt/output/*
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### OpenWrt for Mozart 2 (i.MX8MN)
            - Source: ${{ inputs.source_repo }} @ ${{ inputs.source_branch }}
            - Device: imx8mn-mozart2
            - Default IP: `192.168.1.1`
            - Default username: `root`
            - Default password: `${{ inputs.root_password }}`

            ### 说明
            - 基于 i.MX8MN Cortex-A53 目标编译
            - 使用自定义 imx8mn-mozart2.dts
            - 已包含 swconfig + RTL 交换机驱动
            - 如启动异常，请检查 U-Boot 是否加载 `imx8mn-mozart2.dtb`
