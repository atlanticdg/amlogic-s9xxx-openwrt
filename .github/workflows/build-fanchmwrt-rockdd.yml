#============================================================================================
# Build FanchmWrt for rockdd — 源码编译 + 替换可用 U-Boot
#
# 可用 U-Boot 来源：fanchmwrt 官方 rock-pi-4a 镜像（download.ttcoder.cn）
# 该镜像在 rockdd 上能启动，提取其 U-Boot 替换到我们编译的镜像中
#============================================================================================

name: Build FanchmWrt for rockdd

on:
  workflow_dispatch:
    inputs:
      fanchmwrt_branch:
        description: "FanchmWrt 分支"
        required: true
        default: "fanchmwrt-25.12.4"
        type: choice
        options:
          - "fanchmwrt-25.12.4"
          - "fanchmwrt-25.12.2"
          - "fanchmwrt-24.10.4"
      working_uboot_url:
        description: "可用 rock-pi-4a 镜像的下载地址（提取 U-Boot 用）"
        required: true
        default: "https://download.ttcoder.cn/fanchmwrt/firmware/radxa/fanchmwrt25.12.4-1.0.3-rockchip-armv8-radxa_rock-pi-4a-expand-root-squashfs-sysupgrade.img.gz"
        type: string
      root_password:
        description: "root 密码"
        required: false
        default: "password"
        type: string
      use_ccache:
        description: "使用 ccache 加速"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Etc/UTC
  CCACHE_DIR: /builder/openwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u

      - name: Create virtual disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th

      - name: Clone FanchmWrt source
        working-directory: /builder
        run: |
          FW_BRANCH="${{ inputs.fanchmwrt_branch }}"
          git clone -q --single-branch --depth=1 --branch="${FW_BRANCH}" \
              https://github.com/fanchmwrt/fanchmwrt.git openwrt
          ln -sf /builder/openwrt ${{ github.workspace }}/openwrt
          echo "build_tag=FanchmWrt_rockdd_${FW_BRANCH}_$(date +%Y.%m.%d)" >> ${GITHUB_ENV}
          echo "Source: ${FW_BRANCH}"

      - name: Update feeds
        run: cd openwrt/ && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt/ && ./scripts/feeds install -a

      - name: Customize (root password, hostname)
        run: |
          cd openwrt/
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom << 'EOF'
          #!/bin/sh
          echo "root:__ROOT_PW__" | chpasswd
          uci set system.@system[0].hostname='fanchmwrt-rockdd'
          uci commit system
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom
          sed -i "s/__ROOT_PW__/${{ inputs.root_password }}/g" files/etc/uci-defaults/99-custom

      - name: Configure build
        run: |
          cd openwrt/
          cat > .config << 'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_rock-pi-4a=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_kmod-rtw88-8822be=m
          CONFIG_PACKAGE_rtl8822be-firmware=y
          CONFIG_PACKAGE_wpad-mesh-openssl=y
          CONFIG_PACKAGE_wpa-cli=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          EOF
          echo "Device: $(grep CONFIG_TARGET_DEVICE .config)"

      - name: Download package sources
        run: |
          cd openwrt/
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Inject rockdd DTB into kernel
        run: |
          cd openwrt/

          echo "=== Preparing kernel source ==="
          make target/linux/prepare V=s 2>&1 | tail -20

          # 找到内核源码目录
          KERNEL_DIR=$(find build_dir -maxdepth 3 -type d -name "linux-6.*" | head -1)
          if [[ -z "${KERNEL_DIR}" ]]; then
            KERNEL_DIR=$(find build_dir -maxdepth 3 -type d -name "linux-5.*" | head -1)
          fi
          echo "Kernel dir: ${KERNEL_DIR}"

          if [[ -z "${KERNEL_DIR}" || ! -d "${KERNEL_DIR}/arch/arm64/boot/dts/rockchip" ]]; then
            echo "ERROR: Could not find kernel source directory!"
            find build_dir -maxdepth 4 -type d -name "linux-*" 2>/dev/null | head -20
            exit 1
          fi

          DTS_DIR="${KERNEL_DIR}/arch/arm64/boot/dts/rockchip"

          # 复制 DTS 文件
          cp ${{ github.workspace }}/rk3399-rockdd.dts "${DTS_DIR}/"
          echo "Copied rk3399-rockdd.dts to ${DTS_DIR}/"

          # 添加到 Makefile（在 rock-pi-4a 行之后插入）
          if grep -q "rk3399-rockdd" "${DTS_DIR}/Makefile"; then
            echo "rockdd already in Makefile"
          else
            sed -i '/rk3399-rock-pi-4a\.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3399-rockdd.dtb' "${DTS_DIR}/Makefile"
            echo "Added rk3399-rockdd.dtb to Makefile"
          fi

          echo "=== Verify DTS injection ==="
          ls -la "${DTS_DIR}/rk3399-rockdd.dts"
          grep "rockdd" "${DTS_DIR}/Makefile"

      - name: Get source commit hash
        id: srchash
        run: |
          api_url="https://api.github.com/repos/fanchmwrt/fanchmwrt/git/ref/heads/${{ inputs.fanchmwrt_branch }}"
          source_hash=$(curl -fsSL -m 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              ${api_url} | jq -r '.object.sha')
          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/openwrt/.ccache
          key: fanchmwrt-rockdd-${{ env.source_hash }}
          restore-keys:
            fanchmwrt-rockdd-

      - name: Compile FanchmWrt
        id: compile
        run: |
          cd openwrt/
          echo "Compiling with $(nproc) threads..."
          make -j$(($(nproc) + 1)) V=s 2>&1 | tail -50
          RET=${PIPESTATUS[0]}
          if [[ ${RET} -ne 0 ]]; then
            echo "Retrying with -j1 V=s..."
            make -j1 V=s 2>&1 | tail -200
            RET=${PIPESTATUS[0]}
          fi
          [[ ${RET} -eq 0 ]] && echo "status=success" >> ${GITHUB_OUTPUT} || {
            echo "status=failed" >> ${GITHUB_OUTPUT}; exit 1; }
          ccache -s 2>/dev/null || true

      # ============================================
      # 下载可用镜像 → 提取 U-Boot → 替换
      # ============================================
      - name: Replace U-Boot with working version
        if: ${{ steps.compile.outputs.status == 'success' }}
        run: |
          cd openwrt/

          echo "=== Generated files ==="
          ls -lah bin/targets/rockchip/armv8/

          # 找到我们编译的镜像
          IMG_GZ=$(ls bin/targets/rockchip/armv8/*rock-pi-4a*.img.gz 2>/dev/null | head -1)
          if [[ -z "${IMG_GZ}" ]]; then
            echo "ERROR: No .img.gz found!"
            exit 1
          fi
          echo "New image: ${IMG_GZ}"
          # OpenWrt 的 .img.gz 可能有 trailing garbage，gunzip 会返回非零退出码
          # 但文件实际已成功解压，用 || true 忽略退出码，再验证文件是否存在
          gunzip -k -f "${IMG_GZ}" 2>/dev/null || true
          IMG="${IMG_GZ%.gz}"
          if [[ ! -f "${IMG}" ]]; then
            echo "ERROR: Decompression failed!"
            exit 1
          fi
          echo "Decompressed: ${IMG} ($(du -h "${IMG}" | cut -f1))"

          # ============================================
          # 下载官方可用镜像
          # ============================================
          WORKING_URL="${{ inputs.working_uboot_url }}"
          echo "=== Downloading working image ==="
          echo "URL: ${WORKING_URL}"
          curl -sL -o /tmp/working.img.gz "${WORKING_URL}"
          SIZE=$(du -h /tmp/working.img.gz | cut -f1)
          echo "Downloaded: ${SIZE}"

          if [[ "${SIZE}" == "0" || "${SIZE}" == "" ]]; then
            echo "ERROR: Download failed or file is empty"
            exit 1
          fi

          # 解压（同样可能有 trailing garbage）
          gunzip -k -f /tmp/working.img.gz 2>/dev/null || true
          WORKING_IMG=/tmp/working.img

          if [[ ! -f "${WORKING_IMG}" ]]; then
            echo "ERROR: Could not extract working image"
            exit 1
          fi

          echo "Working image size: $(du -h ${WORKING_IMG} | cut -f1)"

          # 检查可用镜像的分区信息
          echo "=== Working image partition info ==="
          fdisk -l "${WORKING_IMG}" 2>/dev/null || true

          # ============================================
          # 提取 U-Boot
          # RK3399 标准布局：
          #   扇区 64 (32KB): idbloader.img (SPL + TPL + DDR init)
          #   扇区 16384 (8MB): u-boot.itb (U-Boot proper + ATF + DTB)
          # ============================================
          echo "=== Extracting U-Boot from working image ==="

          # 提取 idbloader（2MB 足够）
          dd if="${WORKING_IMG}" of=/tmp/idbloader.img bs=512 skip=64 count=4096 2>/dev/null
          echo "idbloader.img: $(du -h /tmp/idbloader.img | cut -f1)"

          # 提取 u-boot.itb（4MB 足够）
          dd if="${WORKING_IMG}" of=/tmp/u-boot.itb bs=512 skip=16384 count=8192 2>/dev/null
          echo "u-boot.itb: $(du -h /tmp/u-boot.itb | cut -f1)"

          # 验证提取的文件是否有效
          echo "=== Verifying U-Boot files ==="
          file /tmp/idbloader.img 2>/dev/null || true
          file /tmp/u-boot.itb 2>/dev/null || true

          # 检查 idbloader 的头部标识（RK3399 应该有特定的 magic）
          echo "idbloader first bytes:"
          xxd -l 64 /tmp/idbloader.img 2>/dev/null | head -4 || true

          echo "u-boot.itb first bytes:"
          xxd -l 64 /tmp/u-boot.itb 2>/dev/null | head -4 || true

          # ============================================
          # 替换到我们编译的镜像
          # ============================================
          echo "=== Replacing U-Boot in new image ==="
          dd if=/tmp/idbloader.img of="${IMG}" bs=512 seek=64 conv=notrunc 2>/dev/null
          echo "idbloader replaced"
          dd if=/tmp/u-boot.itb of="${IMG}" bs=512 seek=16384 conv=notrunc 2>/dev/null
          echo "u-boot.itb replaced"

          # ============================================
          # 替换 kernel.img（FIT 镜像）中的 DTB 为 rockdd 版本
          # ============================================
          echo "=== Replacing DTB in kernel.img FIT image ==="

          # 找到编译好的 rockdd DTB
          ROCKDD_DTB=$(find build_dir -path "*/arch/arm64/boot/dts/rockchip/rk3399-rockdd.dtb" 2>/dev/null | head -1)
          if [[ -z "${ROCKDD_DTB}" || ! -f "${ROCKDD_DTB}" ]]; then
            echo "WARNING: rockdd DTB not found in build_dir, searching more broadly..."
            ROCKDD_DTB=$(find . -name "rk3399-rockdd.dtb" 2>/dev/null | head -1)
          fi

          echo "rockdd DTB path: ${ROCKDD_DTB}"
          if [[ -n "${ROCKDD_DTB}" && -f "${ROCKDD_DTB}" ]]; then
            echo "rockdd DTB size: $(du -h "${ROCKDD_DTB}" | cut -f1)"
          else
            echo "ERROR: Could not find compiled rk3399-rockdd.dtb!"
            echo "Available dtb files:"
            find build_dir -name "rk3399-rock*.dtb" 2>/dev/null | head -10
            exit 1
          fi

          # 安装 u-boot-tools（mkimage 和 dumpimage）
          echo "=== Installing u-boot-tools ==="
          sudo apt-get install -y u-boot-tools 2>/dev/null || true
          which mkimage && which dumpimage

          echo "=== New image partition info ==="
          fdisk -l "${IMG}" 2>/dev/null || true

          BOOT_INFO=$(parted "${IMG}" unit B print 2>/dev/null || true)
          BOOT_START=$(echo "${BOOT_INFO}" | grep "^ 1 " | awk '{print $2}' | tr -d 'B')
          if [[ -n "${BOOT_START}" ]]; then
            mkdir -p /tmp/bootmnt
            sudo mount -o loop,offset=${BOOT_START} "${IMG}" /tmp/bootmnt 2>/dev/null && {
              echo "Boot partition files (before):"
              ls -la /tmp/bootmnt/

              KERNEL_IMG=/tmp/bootmnt/kernel.img

              if [[ -f "${KERNEL_IMG}" ]]; then
                echo "=== kernel.img found, examining FIT structure ==="
                dumpimage -l "${KERNEL_IMG}" || echo "dumpimage -l failed, trying file command"
                file "${KERNEL_IMG}"

                # 提取 FIT 镜像中的各个组件
                FIT_DIR=/tmp/fit_extract
                rm -rf "${FIT_DIR}"
                mkdir -p "${FIT_DIR}"

                # 用 dumpimage 提取所有镜像
                cd "${FIT_DIR}"
                # 尝试列出并提取配置
                CONFIGS=$(dumpimage -l "${KERNEL_IMG}" 2>/dev/null | grep "^  Configuration" | sed 's/.*(\(.*\))/\1/')
                echo "FIT configurations: ${CONFIGS}"

                # 提取 kernel
                dumpimage -T flat_dt -p 0 -o kernel.bin "${KERNEL_IMG}" 2>/dev/null && echo "Extracted kernel" || echo "Failed to extract kernel"
                # 提取 fdt（DTB）- 通常是第二个镜像
                dumpimage -T flat_dt -p 1 -o original.dtb "${KERNEL_IMG}" 2>/dev/null && echo "Extracted fdt/dtb" || echo "Failed to extract fdt"

                ls -la "${FIT_DIR}"/

                # 检查原 DTB 的信息
                if [[ -f "${FIT_DIR}/original.dtb" ]]; then
                  echo "Original DTB size: $(du -h "${FIT_DIR}/original.dtb" | cut -f1)"
                  strings "${FIT_DIR}/original.dtb" | grep -i "rock.*pi\|model\|compatible" | head -10
                fi

                # 用 rockdd DTB 替换并重新打包 FIT 镜像
                echo "=== Rebuilding kernel.img with rockdd DTB ==="

                # 创建 ITS 文件（FIT image source）
                cat > /tmp/kernel.its << 'FIT_EOF'
/dts-v1/;

/ {
	description = "FIT image with rockdd DTB";
	#address-cells = <1>;

	images {
		kernel {
			description = "Linux kernel";
			data = /incbin/("kernel.bin");
			type = "kernel";
			arch = "arm64";
			os = "linux";
			compression = "none";
			load = <0x00280000>;
			entry = <0x00280000>;
			hash-1 {
				algo = "sha256";
			};
		};
		fdt {
			description = "rockdd device tree";
			data = /incbin/("rockdd.dtb");
			type = "flat_dt";
			arch = "arm64";
			compression = "none";
			hash-1 {
				algo = "sha256";
			};
		};
	};

	configurations {
		default = "conf-rockdd";
		conf-rockdd {
			description = "Boot with rockdd DTB";
			kernel = "kernel";
			fdt = "fdt";
		};
	};
};
FIT_EOF

                cp "${ROCKDD_DTB}" "${FIT_DIR}/rockdd.dtb"

                if [[ -f "${FIT_DIR}/kernel.bin" ]]; then
                  cd "${FIT_DIR}"
                  mkimage -f /tmp/kernel.its /tmp/kernel_new.img
                  if [[ -f /tmp/kernel_new.img ]]; then
                    echo "New kernel.img size: $(du -h /tmp/kernel_new.img | cut -f1)"
                    dumpimage -l /tmp/kernel_new.img
                    # 替换回去
                    sudo cp /tmp/kernel_new.img "${KERNEL_IMG}"
                    echo "kernel.img replaced with rockdd version"
                  else
                    echo "ERROR: Failed to build new FIT image"
                  fi
                else
                  echo "ERROR: kernel.bin not extracted, cannot rebuild FIT"
                fi

                cd /
              else
                echo "ERROR: kernel.img not found in boot partition!"
              fi

              echo "Boot partition files (after):"
              ls -la /tmp/bootmnt/

              sync
              sudo umount /tmp/bootmnt
              echo "FIT DTB replacement done, unmounted boot partition"
            } || echo "Could not mount boot partition"
          fi

          # 重新压缩
          gzip -k -f "${IMG}"

          # 输出
          mkdir -p output
          cp -f "${IMG}.gz" output/rockdd_fanchmwrt-${{ inputs.fanchmwrt_branch }}_$(date +%Y.%m.%d).img.gz

          echo "=== Final output ==="
          ls -lah output/

      - name: Organize output
        if: ${{ steps.compile.outputs.status == 'success' }}
        run: |
          cd openwrt/
          mkdir -p output
          cp -f bin/targets/rockchip/armv8/*.manifest output/ 2>/dev/null || true
          cp -f .config output/config
          ls -lah output/

      - name: Upload to Release
        if: ${{ steps.compile.outputs.status == 'success' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.build_tag }}
          name: FanchmWrt for rockdd
          files: |
            openwrt/output/*
          overwrite_files: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### FanchmWrt for rockdd (RK3399)
            - Source: [fanchmwrt](https://github.com/fanchmwrt/fanchmwrt/tree/${{ inputs.fanchmwrt_branch }})
            - Base device: `radxa_rock-pi-4a`
            - U-Boot: Replaced from working image (download.ttcoder.cn)
            - DTB: Custom rockdd DTB with PCIe RTL8822BE WiFi support
            - Default IP: `192.168.1.1`
            - Default username: `root`
            - Default password: `${{ inputs.root_password }}`

            ### 烧录方法
            1. 解压 `.img.gz` 得到 `.img`
            2. 使用 RKDevTool（Windows）通过 MaskROM 模式烧录

            ### 说明
            - 内核 + rootfs 来自 FanchmWrt 源码完整编译
            - U-Boot 从 FanchmWrt 官方 rock-pi-4a 镜像提取替换（解决启动问题）
            - DTB 为 rockdd 定制版本，支持 PCIe RTL8822BE WiFi
            - WiFi 驱动：kmod-rtw88-8822be + rtl8822be-firmware 已内置
